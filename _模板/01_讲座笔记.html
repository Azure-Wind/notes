<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>【讲座主题】· 现场笔记</title>
<style>
  :root{--ink:#16181d;--soft:#4a5058;--faint:#7b838d;--line:#e2e5ea;--bg:#f4f5f7;--paper:#fff;--accent:#2f5fd0;--accent-soft:#eef2fc;--warn:#b4531a;--warn-soft:#fdf3e7;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:15.5px;line-height:1.72;}
  .page{max-width:920px;margin:0 auto;padding:32px 20px 72px;}
  header{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:24px 30px;margin-bottom:18px;}
  h1{font-size:23px;margin:0;}
  .sub{color:var(--faint);font-size:13.5px;margin:8px 0 0;}
  section{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:22px 30px 26px;margin-bottom:18px;}
  h2{font-size:17.5px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);}
  .blank{color:var(--faint);font-size:14px;}
  .tip{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;padding:13px 17px;margin:14px 0;font-size:14.5px;}
  .tip b{color:var(--accent);}
  .note{background:var(--warn-soft);border-left:3px solid var(--warn);border-radius:0 6px 6px 0;padding:13px 17px;margin:14px 0;font-size:14px;}
  .note b{color:var(--warn);}
  table{width:100%;border-collapse:collapse;font-size:14px;margin:14px 0;}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;}
  thead th{background:#f7f8fa;font-size:12.5px;color:var(--soft);letter-spacing:.04em;}
  ul,ol{padding-left:22px;} li{margin:6px 0;}
  @media print{
    @page{size:A4;margin:14mm}
    body{background:#fff;font-size:10.5pt;}
    .page{max-width:none;padding:0;}
    header,section{border:none;border-radius:0;padding:0;margin:0 0 8mm;}
    header{border-bottom:2px solid #000;padding-bottom:4mm;}
  }
</style>
</head>
<body>
<div class="page">
<header>
  <h1>【讲座主题】· 现场笔记</h1>
  <p class="sub">【讲者】　·　【时间地点】</p>
</header>

<section>
  <h2>开场：问题定义</h2>
  <p class="blank">【他如何定义问题？划定的边界是什么？】</p>
</section>

<section>
  <h2>主体脉络</h2>
  <p class="blank">【按他讲的顺序记主干；"数据从哪来 / 奖励怎么给 / 怎么评测"这类方法论重点记】</p>
</section>

<section>
  <h2>数据与实验结论</h2>
  <p class="blank">【规模、指标、消融、harness 是什么】</p>
</section>

<section>
  <h2>存疑与待查</h2>
  <p class="blank">【没听懂的名词、想验证的说法、与预习材料的出入】</p>
</section>

<section>
  <h2>提问与回答</h2>
  <p class="blank">【自己问的、别人问的、讲者的回答】</p>
</section>

<section>
  <h2>我的收获</h2>
  <div class="note"><b>只写三条。</b>写不出三条，说明这场讲座还没消化完。</div>
  <ol>
    <li class="blank">【收获一】</li>
    <li class="blank">【收获二】</li>
    <li class="blank">【收获三】</li>
  </ol>
</section>

</div>
</body>
</html>
